server {
    server_name shanghaitravels.com.bd www.shanghaitravels.com.bd;

    root /var/www/ShanghaiTravels;
    index index.html;

    # gzip compression for text assets
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # security headers (repeated in child locations because add_header in a
    # location block does NOT inherit server-level add_header directives)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # hashed build assets — safe to cache for a year, immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html must never be cached so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # TEMPORARY cutover test path → NEW ERP API (:4200). Owner browser-tests
    # here while /api/ still serves the old auth API. REMOVE after cutover
    # (runbook rule d — no second public path into the API).
    location /api2/ {
        rewrite ^/api2/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public site endpoints (config + intake) are served by the NEW ERP (:4200),
    # even though auth/login below still runs on the interim API (:4100). This
    # lets the public website read China-only config and create real cases at
    # /api/public/* WITHOUT the login cutover. Longer prefix wins over /api/, so
    # login is untouched. Survives the cutover (already on :4200). ERP prefix=api.
    location /api/public/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth API — reverse proxy to the Node auth service (localhost only)
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block the compiled demo admin/staff screens (mock data) from direct public
    # access. Real staff UI = /visa-admin/. Full removal needs the frontend rebuild.
    # Add-only; Shanghai Travels server block only.
    location /admin { return 404; }
    location /staff { return 404; }

    # Staff admin tools — never cache the HTML shell (prevents the stale-cache
    # problem seen on the website deploy). Add-only; mirrors /index.html no-cache.
    location ~ ^/visa-admin(-staging)?/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    # TravelOS ERP (Vite base=/erp/ + createHashRouter)
    # Hashed assets must NEVER fall through to SPA HTML (MIME text/html breaks JS/CSS).
    location /erp/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ERP shell — HashRouter keeps routes in the fragment; serve index.html only.
    location /erp/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /erp/index.html;
    }

    # SPA fallback — react-router createBrowserRouter needs this or non-root
    # routes 404 on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shanghaitravels.com.bd/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shanghaitravels.com.bd/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.shanghaitravels.com.bd) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = shanghaitravels.com.bd) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name shanghaitravels.com.bd www.shanghaitravels.com.bd;
    return 404; # managed by Certbot




}