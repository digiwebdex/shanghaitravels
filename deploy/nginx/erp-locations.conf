    # TravelOS ERP (Vite base=/erp/ + createHashRouter)
    # Hashed assets must NEVER fall through to SPA HTML (MIME text/html breaks JS/CSS).
    location /erp/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ERP shell — HashRouter keeps routes in the fragment; serve index.html only.
    location /erp/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /erp/index.html;
    }
